<title>Partner Health Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#F4F6FB;}
  body{font-family:'Inter',system-ui,sans-serif;color:#0B0B3B;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  a{color:#5465FF;text-decoration:none;} a:hover{color:#000050;text-decoration:underline;}
  button{font-family:inherit;}
  .tnum{font-variant-numeric:tabular-nums;}
  .ph-card{transition:all .18s;}
  .ph-card:hover{box-shadow:0 12px 30px rgba(0,0,80,0.12)!important;transform:translateY(-2px);border-color:#B9C2E8!important;}
  .ph-monthbtn:hover:not([disabled]){background:rgba(255,255,255,0.16)!important;}
  .ph-monthbtn[disabled]{opacity:.4;cursor:default;}
  .ph-regionpill{transition:all .15s;} .ph-regionpill:hover{border-color:#5465FF!important;}
  .ph-sortbtn{transition:all .15s;}
  .ph-regionrow{transition:background .15s;} .ph-regionrow:hover{background:#F3F5FB!important;}
  .ph-close:hover{background:#000050!important;}
  .ph-export:hover{background:#000050!important;}
  @keyframes phDrawerIn{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
  @keyframes phFadeIn{from{opacity:0;}to{opacity:1;}}
  #ph-print{display:none;}
  .keep{break-inside:avoid;}
  @media print{
    #ph-main,#ph-drawer{display:none!important;}
    #ph-print{display:block!important;}
    html,body{background:#fff!important;}
    @page{size:letter;margin:0.6in;}
  }
</style>

let D = null;
let HEALTHY = 7, MONITOR = 5;
let state = null;

const fmt = v => (v == null ? '-' : (Math.round(v * 10) / 10).toFixed(1));
const mean = arr => { const a = arr.filter(v => v != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dimScores(p, m, lens){
  return D.DIMS.map((_, i) => {
    const mo = p.months[m] || {};
    if (lens !== 'ALL'){ const r = mo[lens]; return (r && r[i] != null) ? r[i] : null; }
    let sw = 0, sv = 0;
    D.REGIONS.forEach(rn => { const r = mo[rn]; if (r && r[i] != null){ const w = p.rw[rn] || 0; sw += w; sv += w * r[i]; } });
    return sw ? sv / sw : null;
  });
}
function composite(scores){ let sw = 0, sv = 0; D.DIMS.forEach((d, i) => { if (scores[i] != null){ sw += d.w; sv += d.w * scores[i]; } }); return sw ? sv / sw : null; }
function band(v){
  if (v == null) return {label:'No data', color:'#C3C8DC', bg:'#EEF0F7', text:'#6B7194'};
  if (v >= HEALTHY) return {label:'Healthy', color:'#B0F467', bg:'rgba(176,244,103,0.32)', text:'#4C7C0A'};
  if (v >= MONITOR) return {label:'Monitor', color:'#93DFE3', bg:'rgba(147,223,227,0.32)', text:'#0E7490'};
  return {label:'Action Required', color:'#5465FF', bg:'rgba(84,101,255,0.13)', text:'#3241CC'};
}
function spark(vals, w, h){
  const vs = vals.filter(v => v != null);
  if (vs.length < 2 || vs.length !== vals.length) return {points:'', cx:0, cy:0, r:0};
  const min = Math.min.apply(null, vs) - 0.4, max = Math.max.apply(null, vs) + 0.4;
  let cx = 0, cy = 0;
  const pts = vals.map((v, i) => { const x = 3 + (i / (vals.length - 1)) * (w - 6); const y = h - 3 - ((v - min) / (max - min || 1)) * (h - 6); cx = x; cy = y; return x.toFixed(1) + ',' + y.toFixed(1); });
  return {points: pts.join(' '), cx: cx.toFixed(1), cy: cy.toFixed(1), r: 2.6};
}
function fmtDelta(cur, prev){
  if (cur == null || prev == null) return {text:'-', color:'#9AA0B8'};
  const d = Math.round((cur - prev) * 10) / 10;
  if (d > 0.04) return {text:'▲ ' + d.toFixed(1), color:'#4C7C0A'};
  if (d < -0.04) return {text:'▼ ' + Math.abs(d).toFixed(1), color:'#3241CC'};
  return {text:'· 0.0', color:'#9AA0B8'};
}

function computeRows(){
  const m = state.month, lens = state.region, prevM = m > 0 ? m - 1 : null;
  return D.partners.map(p => {
    const dims = dimScores(p, m, lens);
    const comp = composite(dims);
    const prevDims = prevM != null ? dimScores(p, prevM, lens) : null;
    const prev = prevDims ? composite(prevDims) : null;
    const hist = D.MONTHS.map((_, mm) => composite(dimScores(p, mm, lens)));
    return {p, dims, comp, prev, prevDims, hist};
  });
}
function reportedRegions(){ const m = state.month; return D.REGIONS.filter(rn => D.partners.some(p => p.months[m] && p.months[m][rn])); }
function partnerEscs(name){
  const lab = D.MONTHS[state.month];
  return (D.escByMonth[lab] || [])
    .filter(e => e.p === name && (state.region === 'ALL' || e.r === state.region))
    .sort((a, b) => D.SEV[b.sev].rank - D.SEV[a.sev].rank);
}
function logoImg(name, h, maxW){
  const uri = D.logos[name];
  if (uri) return '<img src="' + uri + '" alt="' + esc(name) + '" title="' + esc(name) + '" style="height:' + h + ';max-width:' + maxW + ';object-fit:contain;object-position:left center;display:block;">';
  return '<div style="font-weight:800;font-size:16px;color:#000050;">' + esc(name) + '</div>';
}
function sortRows(rows){
  const rs = rows.slice();
  rs.sort((a, b) => {
    if (state.sort === 'name') return a.p.name.localeCompare(b.p.name);
    const va = state.sort === 'delta' ? ((a.comp != null && a.prev != null) ? a.comp - a.prev : null) : a.comp;
    const vb = state.sort === 'delta' ? ((b.comp != null && b.prev != null) ? b.comp - b.prev : null) : b.comp;
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return vb - va;
  });
  return rs;
}

      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;">' + wm +
        '<div style="display:flex;align-items:center;gap:2px;background:#000050;border-radius:999px;padding:4px;box-shadow:0 8px 24px rgba(0,0,80,0.25);">' +
          '<button class="ph-monthbtn" data-act="prev" ' + prevDis + ' title="Previous cycle" style="background:transparent;border:none;color:#fff;font-size:16px;line-height:1;padding:6px 11px;border-radius:999px;cursor:pointer;">‹</button>' +
          '<div class="tnum" style="min-width:128px;text-align:center;color:#fff;font-size:12.5px;font-weight:650;">' + esc(monthLabel) + '</div>' +
          '<button class="ph-monthbtn" data-act="next" ' + nextDis + ' title="Next cycle" style="background:transparent;border:none;color:#fff;font-size:16px;line-height:1;padding:6px 11px;border-radius:999px;cursor:pointer;">›</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function portfolioHTML(rows, reported){
  const kComp = mean(rows.map(r => r.comp));
  const kDelta = fmtDelta(kComp, mean(rows.map(r => r.prev)));
  const gauge = kComp == null ? 0 : kComp * 10;
  const counts = {Healthy:0, Monitor:0, 'Action Required':0, 'No data':0};
  rows.forEach(r => { counts[band(r.comp).label]++; });
  const total = rows.length || 1;
  const mix = [{pct:counts.Healthy/total*100,color:'#B0F467'},{pct:counts.Monitor/total*100,color:'#93DFE3'},{pct:counts['Action Required']/total*100,color:'#5465FF'}];
  const legend = [{n:counts.Healthy,label:'Healthy',color:'#B0F467'},{n:counts.Monitor,label:'Monitor',color:'#93DFE3'},{n:counts['Action Required'],label:'Action',color:'#5465FF'}];
  const escCount = (D.escByMonth[D.MONTHS[state.month]] || []).filter(e => state.region === 'ALL' || e.r === state.region).length;
  const mixSeg = mix.map(s => '<div style="width:' + s.pct + '%;background:' + s.color + ';transition:width 0.3s;"></div>').join('');
  const legItems = legend.map(g => '<div style="display:flex;align-items:center;gap:6px;"><div style="width:8px;height:8px;border-radius:99px;background:' + g.color + ';flex:none;"></div><div style="font-size:11.5px;color:#6B7194;font-weight:600;"><span style="color:#0B0B3B;font-weight:750;">' + g.n + '</span> ' + g.label + '</div></div>').join('');
  const cov = D.REGIONS.map(rn => { const has = reported.indexOf(rn) >= 0; return '<div title="' + (has ? 'Reported this cycle' : 'Pending - excluded from weighting, not counted as zero') + '" style="font-size:10.5px;font-weight:650;color:' + (has ? '#4C7C0A' : '#9AA0B8') + ';background:' + (has ? 'rgba(176,244,103,0.32)' : '#EEF0F7') + ';padding:3px 8px;border-radius:99px;white-space:nowrap;">' + rn + '</div>'; }).join('');
  return '' +
  '<div style="background:#fff;border:1px solid #E3E7F2;border-radius:18px;padding:20px 26px;box-shadow:0 10px 28px rgba(0,0,80,0.07);display:grid;grid-template-columns:auto 1fr auto auto;gap:32px;align-items:center;">' +
    '<div style="display:flex;align-items:center;gap:16px;">' +
      '<div style="width:64px;height:64px;border-radius:99px;background:conic-gradient(#5465FF 0%,#93DFE3 50%,#B0F467 ' + gauge + '%,#EEF0F7 ' + gauge + '%);display:flex;align-items:center;justify-content:center;">' +
        '<div class="tnum" style="width:50px;height:50px;border-radius:99px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#000050;">' + fmt(kComp) + '</div>' +
      '</div>' +
      '<div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.11em;color:#6B7194;">PORTFOLIO COMPOSITE</div>' +
        '<div class="tnum" title="' + esc(deltaVsLabel()) + '" style="font-size:12px;font-weight:650;margin-top:5px;color:' + kDelta.color + ';">' + kDelta.text + ' <span style="color:#9AA0B8;font-weight:500;">vs prior</span></div>' +
      '</div>' +
    '</div>' +
    '<div><div style="display:flex;height:8px;border-radius:99px;overflow:hidden;background:#EEF0F7;">' + mixSeg + '</div>' +
      '<div style="display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;">' + legItems + '</div></div>' +
    '<div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.11em;color:#6B7194;">ESCALATIONS</div>' +
      '<div style="display:flex;align-items:baseline;gap:6px;margin-top:6px;"><div class="tnum" style="font-size:22px;font-weight:800;line-height:1;">' + escCount + '</div><div style="font-size:11px;color:#9AA0B8;font-weight:550;">open</div></div></div>' +
    '<div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.11em;color:#6B7194;">COVERAGE</div>' +
      '<div style="display:flex;gap:5px;margin-top:8px;">' + cov + '</div></div>' +
  '</div>';
}

function filtersHTML(reported){
  const pills = ['ALL'].concat(D.REGIONS).map(rn => {
    const active = state.region === rn;
    const pending = rn !== 'ALL' && reported.indexOf(rn) < 0;
    const label = rn === 'ALL' ? 'All regions' : rn;
    const title = pending ? 'No submissions this cycle - shown as no data, not zero' : (rn === 'ALL' ? 'Weighted across reported regions' : 'View through ' + rn + ' submissions only');
    const color = active ? '#fff' : (pending ? '#9AA0B8' : '#3C4160');
    return '<button class="ph-regionpill" data-act="region" data-val="' + rn + '" title="' + esc(title) + '" style="border:1px solid ' + (active ? '#000050' : '#DDE1EE') + ';background:' + (active ? '#000050' : '#fff') + ';color:' + color + ';font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;">' + label + '</button>';
  }).join('');
  const sorts = [{id:'score',label:'Score'},{id:'delta',label:'Δ MoM'},{id:'name',label:'A–Z'}].map(o => {
    const on = state.sort === o.id;
    return '<button class="ph-sortbtn" data-act="sort" data-val="' + o.id + '" style="border:none;background:' + (on ? '#fff' : 'transparent') + ';color:' + (on ? '#000050' : '#6B7194') + ';box-shadow:' + (on ? '0 1px 3px rgba(0,0,80,0.15)' : 'none') + ';font-size:12px;font-weight:650;padding:6px 13px;border-radius:8px;cursor:pointer;">' + o.label + '</button>';
  }).join('');
  return '' +
  '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 16px;flex-wrap:wrap;">' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + pills + '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;"><div style="font-size:11.5px;color:#6B7194;font-weight:600;">Sort</div>' +
      '<div style="display:flex;gap:2px;background:#E7EAF3;border-radius:10px;padding:3px;">' + sorts + '</div></div>' +
  '</div>';
}

function cardHTML(r){
  const p = r.p, b = band(r.comp), delta = fmtDelta(r.comp, r.prev), sp = spark(r.hist, 90, 26);
  const logoH = (D.logoHCard[p.name] || '22px');
  const bars = D.DIMS.map((d, i) => {
    const v = r.dims[i];
    const h = v == null ? 8 : v * 10;
    const color = v == null ? '#EBEDF5' : band(v).color;
    return '<div title="' + esc(d.label + ': ' + fmt(v)) + '" style="flex:1;height:' + h + '%;min-height:3px;border-radius:3px 3px 0 0;background:' + color + ';opacity:0.9;"></div>';
  }).join('');
  const pEscs = partnerEscs(p.name), worst = pEscs[0];
  let footerLeft;
  if (worst){
    const sv = D.SEV[worst.sev];
    const lbl = worst.sev + (pEscs.length > 1 ? ' +' + (pEscs.length - 1) : '');
    const title = pEscs.map(e => e.sev + ' (' + e.r + ')' + (e.note ? ': ' + e.note : '')).join('\n');
    footerLeft = '<div title="' + esc(title) + '" style="font-size:10px;font-weight:700;color:' + sv.color + ';background:' + sv.bg + ';padding:3px 9px;border-radius:99px;white-space:nowrap;">⚑ ' + esc(lbl) + '</div>';
  } else {
    footerLeft = '<div style="font-size:10.5px;color:#9AA0B8;font-weight:550;">No escalations</div>';
  }
  const sparkSvg = '<svg viewBox="0 0 90 26" style="width:90px;height:26px;overflow:visible;display:block;flex:none;"><polyline points="' + sp.points + '" fill="none" stroke="#000050" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></polyline>' + (sp.r ? '<circle cx="' + sp.cx + '" cy="' + sp.cy + '" r="' + sp.r + '" fill="#000050"></circle>' : '') + '</svg>';
  return '' +
  '<div class="ph-card" data-act="open" data-val="' + esc(p.name) + '" role="button" tabindex="0" style="background:#fff;border:1px solid #E3E7F2;border-top:4px solid ' + b.color + ';border-radius:16px;padding:20px 20px 16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,80,0.04);">' +
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">' +
      '<div style="height:30px;display:flex;align-items:center;">' + logoImg(p.name, logoH, '130px') + '</div>' +
      '<div style="display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:' + b.text + ';background:' + b.bg + ';padding:4px 10px;border-radius:99px;white-space:nowrap;flex:none;">' + b.label + '</div>' +
    '</div>' +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;">' +
      '<div style="display:flex;align-items:baseline;gap:5px;">' +
        '<span class="tnum" style="font-size:36px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:#000050;">' + fmt(r.comp) + '</span>' +
        '<span style="font-size:11px;color:#B4B9CF;font-weight:550;">/10</span>' +
        '<span class="tnum" title="' + esc(deltaVsLabel()) + '" style="font-size:12px;font-weight:650;margin-left:4px;color:' + delta.color + ';">' + delta.text + '</span>' +
      '</div>' + sparkSvg +
    '</div>' +
    '<div style="display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:16px;">' + bars + '</div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #F1F3F9;">' + footerLeft +
      '<div style="font-size:11px;color:#5465FF;font-weight:650;white-space:nowrap;">Details →</div>' +
    '</div>' +
  '</div>';
}

function drawerHTML(animate){
  const rows = computeRows();
  const selRow = rows.find(r => r.p.name === state.selected);
  if (!selRow) return '';
  const p = selRow.p, b = band(selRow.comp), delta = fmtDelta(selRow.comp, selRow.prev);
  const m = state.month, lens = state.region, monthLabel = D.MONTHS[m];
  const noData = selRow.comp == null;
  const logoH = (D.logoHDrawer[p.name] || '30px');

  let body;
  if (noData){
    const msg = 'No submission from ' + (lens === 'ALL' ? 'any region' : lens) + ' for ' + monthLabel + '. Missing regions are excluded from the weighting - never counted as zero.';
    body = '<div style="color:#8A90AC;font-size:13px;line-height:1.5;">' + esc(msg) + '</div>';
  } else {
    const dims = D.DIMS.map((d, i) => {
      const v = selRow.dims[i];
      const dd = fmtDelta(v, selRow.prevDims ? selRow.prevDims[i] : null);
      const pct = v == null ? 0 : v * 10;
      const fillSize = (v == null || v <= 0 ? 100 : 10000 / (v * 10)) + '% 100%';
      const regParts = D.REGIONS.filter(rn => p.months[m][rn] && p.months[m][rn][i] != null).map(rn => rn + ' ' + p.months[m][rn][i].toFixed(1));
      const ticks = lens === 'ALL' ? D.REGIONS.filter(rn => p.months[m][rn] && p.months[m][rn][i] != null).map(rn =>
        '<div title="' + esc(rn + ' ' + p.months[m][rn][i].toFixed(1)) + '" style="position:absolute;top:-3px;left:' + (p.months[m][rn][i] * 10) + '%;width:2px;height:14px;border-radius:2px;background:#000050;opacity:0.32;"></div>').join('') : '';
      return '<div title="' + esc(regParts.join(' · ')) + '" style="display:grid;grid-template-columns:158px 1fr 38px 42px;align-items:center;gap:11px;">' +
        '<div><div style="font-size:12px;font-weight:600;line-height:1.25;">' + esc(d.label) + '</div><div style="font-size:10px;color:#9AA0B8;font-weight:550;margin-top:1px;">' + Math.round(d.w * 100) + '% weight</div></div>' +
        '<div style="position:relative;height:8px;background:#EEF0F7;border-radius:99px;">' +
          '<div style="position:absolute;top:0;bottom:0;left:0;width:' + pct + '%;background-image:linear-gradient(90deg,#5465FF 0%,#93DFE3 50%,#B0F467 100%);background-size:' + fillSize + ';border-radius:99px;transition:width 0.3s;"></div>' + ticks +
        '</div>' +
        '<div class="tnum" style="font-size:12.5px;font-weight:700;text-align:right;">' + fmt(v) + '</div>' +
        '<div class="tnum" style="font-size:10.5px;font-weight:650;text-align:right;color:' + dd.color + ';">' + dd.text + '</div>' +
      '</div>';
    }).join('');

    // ---- REGIONAL DETAIL: one block per submitted region (in-lens) ----
    const shownRegions = D.REGIONS.filter(rn => !!p.months[m][rn] && (lens === 'ALL' || lens === rn));
    const regionBlocks = shownRegions.map(rn => {
      const sc = composite(dimScores(p, m, rn));
      const w = p.rw[rn];
      const sel = lens === rn;
      const rEscs = (D.escByMonth[monthLabel] || []).filter(e => e.p === p.name && e.r === rn);
      const rNote = (D.notesByMonth[monthLabel] || []).find(n => n.p === p.name && n.r === rn);
      const escItems = rEscs.map(e => { const sv = D.SEV[e.sev]; return '<div style="display:flex;gap:9px;align-items:flex-start;">' +
        '<div style="font-size:9.5px;font-weight:700;color:' + sv.color + ';background:' + sv.bg + ';padding:2px 8px;border-radius:99px;flex:none;margin-top:1px;">' + esc(e.sev.toUpperCase()) + '</div>' +
        '<div style="font-size:12.5px;color:#3C4160;line-height:1.5;">' + (e.note ? esc(e.note) : '<span style="color:#9AA0B8;">Flagged — no note provided.</span>') + '</div></div>'; }).join('');
      const attnItem = (rNote && rNote.attention) ? '<div style="display:flex;gap:9px;align-items:flex-start;"><div style="width:6px;height:6px;border-radius:99px;background:#5465FF;margin-top:6px;flex:none;"></div><div style="font-size:12.5px;color:#3C4160;line-height:1.5;"><span style="font-weight:650;color:#0B0B3B;">Needs attention -</span> ' + esc(rNote.attention) + '</div></div>' : '';
      const workItem = (rNote && rNote.working) ? '<div style="display:flex;gap:9px;align-items:flex-start;"><div style="width:6px;height:6px;border-radius:99px;background:#B0F467;margin-top:6px;flex:none;"></div><div style="font-size:12.5px;color:#3C4160;line-height:1.5;"><span style="font-weight:650;color:#0B0B3B;">Working well -</span> ' + esc(rNote.working) + '</div></div>' : '';
      const empty = (rEscs.length === 0 && !(rNote && (rNote.attention || rNote.working))) ? '<div style="font-size:11.5px;color:#9AA0B8;">No escalations or notes this cycle.</div>' : '';
      return '<div style="border:1px solid ' + (sel ? '#5465FF' : '#E9EBF4') + ';border-radius:14px;overflow:hidden;">' +
        '<div class="ph-regionrow" data-act="lens" data-val="' + rn + '" role="button" tabindex="0" title="' + esc(sel ? 'Click to clear the ' + rn + ' lens' : 'View ' + p.name + ' through the ' + rn + ' lens') + '" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:' + (sel ? 'rgba(84,101,255,0.06)' : '#FAFBFE') + ';border-bottom:1px solid #F1F3F9;cursor:pointer;">' +
          '<div style="display:flex;align-items:center;gap:10px;"><div style="font-size:13px;font-weight:750;">' + rn + '</div><div style="font-size:10px;color:#9AA0B8;font-weight:600;">' + (w ? Math.round(w * 100) + '% wt' : '- wt') + '</div></div>' +
          '<div style="display:flex;align-items:baseline;gap:4px;"><span class="tnum" style="font-size:16px;font-weight:750;color:#000050;">' + fmt(sc) + '</span><span style="font-size:10px;color:#9AA0B8;">/10</span></div>' +
        '</div>' +
        '<div style="padding:13px 16px 15px;display:flex;flex-direction:column;gap:8px;">' + escItems + attnItem + workItem + empty + '</div>' +
      '</div>';
    }).join('');

    // Pending regions shown as dashed placeholders (only in the ALL view).
    const pendRegions = (lens === 'ALL') ? D.REGIONS.filter(rn => !p.months[m][rn]) : [];
    let pendingBlock = '';
    if (pendRegions.length){
      const items = pendRegions.map(rn => { const w = p.rw[rn]; return '<div title="No submission this cycle - excluded from weighting, not counted as zero" style="flex:1;border:1px dashed #DDE1EE;border-radius:14px;padding:12px 16px;color:#B4B9CF;font-size:11.5px;font-weight:600;">' + rn + ' - pending this cycle <span style="font-weight:500;">(' + (w ? Math.round(w * 100) + '% wt' : '- wt') + ')</span></div>'; }).join('');
      pendingBlock = '<div style="display:flex;gap:10px;margin-top:12px;">' + items + '</div>';
    }

    const lensNote = lens === 'ALL' ? 'Weighted across reported regions' : lens + ' submissions only';
    body = '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;"><div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#6B7194;">DIMENSION BREAKDOWN</div><div style="font-size:11px;color:#9AA0B8;font-weight:500;">' + esc(lensNote) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:11px;margin-top:14px;">' + dims + '</div>' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#6B7194;margin-top:26px;">REGIONAL DETAIL</div>' +
      '<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px;">' + regionBlocks + '</div>' +
      pendingBlock;
  }

  var ovAnim = animate ? 'animation:phFadeIn 0.2s ease;' : '';
  var pnAnim = animate ? 'animation:phDrawerIn 0.25s ease;' : '';
  return '' +
  '<div style="position:fixed;inset:0;z-index:50;">' +
    '<div data-act="close" style="position:absolute;inset:0;background:rgba(0,0,80,0.38);' + ovAnim + '"></div>' +
    '<div style="position:absolute;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;box-shadow:-20px 0 60px rgba(0,0,80,0.25);' + pnAnim + 'display:flex;flex-direction:column;">' +
      '<div style="position:relative;background:linear-gradient(45deg,#5465FF 0%,#93DFE3 55%,#B0F467 100%);padding:24px 28px;overflow:hidden;flex:none;">' +
        '<div style="position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,80,0.10) 1.2px,transparent 1.2px);background-size:20px 20px;pointer-events:none;"></div>' +
        '<div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">' +
          '<div>' +
            '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.12em;color:rgba(0,0,80,0.6);">PARTNER DETAIL · ' + esc(monthLabel) + '</div>' +
            '<div style="height:36px;display:flex;align-items:center;margin-top:10px;">' + logoImg(p.name, logoH, '190px') + '</div>' +
            '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;">' +
              '<div style="display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#000050;background:rgba(255,255,255,0.75);padding:4px 11px;border-radius:99px;">' + b.label + '</div>' +
              '<div class="tnum" style="font-size:13px;font-weight:750;color:#000050;">' + fmt(selRow.comp) + ' / 10 <span title="' + esc(deltaVsLabel()) + '" style="font-weight:650;">' + delta.text + '</span></div>' +
            '</div>' +
          '</div>' +
          '<button class="ph-close" data-act="close" title="Close" style="background:rgba(0,0,80,0.85);border:none;color:#fff;width:32px;height:32px;border-radius:99px;font-size:14px;cursor:pointer;flex:none;">✕</button>' +
        '</div>' +
        '<button class="ph-export" data-act="export" data-val="' + esc(p.name) + '" title="Download ' + esc(p.name) + ' PDF report (' + esc(monthLabel) + ')" style="position:absolute;right:28px;bottom:14px;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:99px;background:rgba(0,0,80,0.85);color:#fff;font-size:15px;line-height:1;border:none;cursor:pointer;">⤓</button>' +
      '</div>' +
      '<div style="overflow-y:auto;padding:24px 28px 32px;flex:1;">' + body + '</div>' +
    '</div>' +
  '</div>';
}

function deltaVsLabel(){ return state.month > 0 ? 'vs ' + D.MONTHS[state.month - 1] : 'No prior month'; }

// Print-optimized single-partner report (ALL-regions view), rendered into
// #ph-print and sent to the browser's print / Save-as-PDF dialog.
function printReportHTML(name){
  const m = state.month, monthLabel = D.MONTHS[m];
  const p = D.partners.find(x => x.name === name);
  if (!p) return '';
  const dims = dimScores(p, m, 'ALL');
  const comp = composite(dims);
  const prevM = m > 0 ? m - 1 : null;
  const prevDims = prevM != null ? dimScores(p, prevM, 'ALL') : null;
  const prev = prevDims ? composite(prevDims) : null;
  const b = band(comp), delta = fmtDelta(comp, prev);
  const reported = D.REGIONS.filter(rn => !!p.months[m][rn]);
  const pending = D.REGIONS.filter(rn => !p.months[m][rn]);
  const logoH = (D.logoHDrawer[name] || '33px');

  const repText = (reported.length ? reported.join(' · ') : 'none') +
    (pending.length ? ' <span style="color:#B4B9CF;font-weight:550;">(' + pending.join(', ') + ' pending)</span>' : '');

  const dimRows = D.DIMS.map((d, i) => {
    const v = dims[i], dd = fmtDelta(v, prevDims ? prevDims[i] : null);
    const pct = v == null ? 0 : v * 10;
    const fillSize = (v == null || v <= 0 ? 100 : 10000 / (v * 10)) + '% 100%';
    return '<div class="keep" style="display:grid;grid-template-columns:200px 1fr 34px 42px;align-items:center;gap:12px;padding:4px 0;">' +
      '<div style="font-size:11.5px;font-weight:600;white-space:nowrap;">' + esc(d.label) + ' <span style="color:#9AA0B8;font-weight:550;font-size:9.5px;">' + Math.round(d.w * 100) + '%</span></div>' +
      '<div style="position:relative;height:7px;background:#EEF0F7;border-radius:99px;"><div style="position:absolute;top:0;bottom:0;left:0;width:' + pct + '%;background-image:linear-gradient(90deg,#5465FF 0%,#93DFE3 50%,#B0F467 100%);background-size:' + fillSize + ';border-radius:99px;-webkit-print-color-adjust:exact;print-color-adjust:exact;"></div></div>' +
      '<div class="tnum" style="font-size:11.5px;font-weight:700;text-align:right;">' + fmt(v) + '</div>' +
      '<div class="tnum" style="font-size:10px;font-weight:650;text-align:right;color:' + dd.color + ';">' + dd.text + '</div>' +
    '</div>';
  }).join('');

  const regBlocks = reported.map(rn => {
    const sc = composite(dimScores(p, m, rn)), w = p.rw[rn];
    const rEscs = (D.escByMonth[monthLabel] || []).filter(e => e.p === name && e.r === rn);
    const rNote = (D.notesByMonth[monthLabel] || []).find(n => n.p === name && n.r === rn);
    const escItems = rEscs.map(e => { const sv = D.SEV[e.sev]; return '<div class="keep" style="display:flex;gap:9px;align-items:flex-start;">' +
      '<div style="font-size:9px;font-weight:700;color:' + sv.color + ';background:' + sv.bg + ';padding:2px 8px;border-radius:99px;flex:none;margin-top:1px;">' + esc(e.sev.toUpperCase()) + '</div>' +
      '<div style="font-size:11.5px;color:#3C4160;line-height:1.5;">' + (e.note ? esc(e.note) : '<span style="color:#9AA0B8;">Flagged — no note provided.</span>') + '</div></div>'; }).join('');
    const attn = (rNote && rNote.attention) ? '<div class="keep" style="display:flex;gap:9px;align-items:flex-start;"><div style="width:6px;height:6px;border-radius:99px;background:#5465FF;margin-top:6px;flex:none;"></div><div style="font-size:11.5px;color:#3C4160;line-height:1.5;"><span style="font-weight:650;color:#0B0B3B;">Needs attention -</span> ' + esc(rNote.attention) + '</div></div>' : '';
    const work = (rNote && rNote.working) ? '<div class="keep" style="display:flex;gap:9px;align-items:flex-start;"><div style="width:6px;height:6px;border-radius:99px;background:#B0F467;margin-top:6px;flex:none;"></div><div style="font-size:11.5px;color:#3C4160;line-height:1.5;"><span style="font-weight:650;color:#0B0B3B;">Working well -</span> ' + esc(rNote.working) + '</div></div>' : '';
    const empty = (rEscs.length === 0 && !(rNote && (rNote.attention || rNote.working))) ? '<div style="font-size:11px;color:#9AA0B8;">No escalations or notes this cycle.</div>' : '';
    return '<div class="keep" style="border:1px solid #E9EBF4;border-radius:12px;overflow:hidden;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#FAFBFE;border-bottom:1px solid #F1F3F9;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><div style="font-size:12.5px;font-weight:750;">' + rn + '</div><div style="font-size:9.5px;color:#9AA0B8;font-weight:600;">' + (w ? Math.round(w * 100) + '% wt' : '- wt') + '</div></div>' +
        '<div style="display:flex;align-items:baseline;gap:4px;"><span class="tnum" style="font-size:15px;font-weight:750;color:#000050;">' + fmt(sc) + '</span><span style="font-size:9.5px;color:#9AA0B8;">/10</span></div>' +
      '</div>' +
      '<div style="padding:11px 16px 13px;display:flex;flex-direction:column;gap:7px;">' + escItems + attn + work + empty + '</div>' +
    '</div>';
  }).join('');
  const pendBlock = pending.length ? '<div style="display:flex;gap:10px;margin-top:10px;">' + pending.map(rn => { const w = p.rw[rn]; return '<div style="flex:1;border:1px dashed #DDE1EE;border-radius:12px;padding:11px 16px;color:#B4B9CF;font-size:10.5px;font-weight:600;">' + rn + ' - pending this cycle (' + (w ? Math.round(w * 100) + '% wt' : '- wt') + ')</div>'; }).join('') + '</div>' : '';

  const wm = D.wordmark ? '<img src="' + D.wordmark + '" alt="WPP Media" style="height:24px;object-fit:contain;display:block;">' : '<div style="color:#000050;font-weight:800;font-size:15px;">WPP Media</div>';
  const vsLabel = (prevM != null ? ('VS ' + D.MONTHS[prevM]) : 'VS PRIOR').toUpperCase();

  return '<div style="max-width:720px;margin:0 auto;padding:8px 4px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #E3E7F2;font-size:9px;font-weight:700;letter-spacing:0.12em;color:#6B7194;"><div>WPP MEDIA · GLOBAL COMMERCE</div><div>PARTNER HEALTH · ' + esc(monthLabel.toUpperCase()) + '</div></div>' +
    '<div class="keep" style="position:relative;background:linear-gradient(45deg,#5465FF 0%,#93DFE3 55%,#B0F467 100%);border-bottom:4px solid #000050;border-radius:12px 12px 0 0;padding:22px 26px;overflow:hidden;margin-top:12px;">' +
      '<div style="position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,80,0.10) 1.2px,transparent 1.2px);background-size:20px 20px;"></div>' +
      '<div style="position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">' +
        '<div><div style="font-size:10px;font-weight:700;letter-spacing:0.12em;color:rgba(0,0,80,0.6);">PARTNER HEALTH REPORT · ' + esc(monthLabel.toUpperCase()) + '</div>' +
          '<div style="height:34px;display:flex;align-items:center;margin-top:10px;">' + logoImg(name, logoH, '160px') + '</div></div>' + wm +
      '</div>' +
    '</div>' +
    '<div class="keep" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border:1px solid #E3E7F2;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;">' +
      '<div style="padding:14px 18px;border-right:1px solid #EEF0F7;"><div style="font-size:9px;font-weight:700;letter-spacing:0.1em;color:#6B7194;">COMPOSITE</div><div style="display:flex;align-items:baseline;gap:4px;margin-top:6px;"><span class="tnum" style="font-size:24px;font-weight:800;color:#000050;">' + fmt(comp) + '</span><span style="font-size:10px;color:#9AA0B8;">/10</span></div></div>' +
      '<div style="padding:14px 18px;border-right:1px solid #EEF0F7;"><div style="font-size:9px;font-weight:700;letter-spacing:0.1em;color:#6B7194;">STATUS</div><div style="display:inline-flex;font-size:10.5px;font-weight:700;color:' + b.text + ';background:' + b.bg + ';padding:4px 11px;border-radius:99px;margin-top:8px;">' + b.label + '</div></div>' +
      '<div style="padding:14px 18px;border-right:1px solid #EEF0F7;"><div style="font-size:9px;font-weight:700;letter-spacing:0.1em;color:#6B7194;">' + esc(vsLabel) + '</div><div class="tnum" style="font-size:15px;font-weight:750;color:' + delta.color + ';margin-top:8px;">' + delta.text + '</div></div>' +
      '<div style="padding:14px 18px;"><div style="font-size:9px;font-weight:700;letter-spacing:0.1em;color:#6B7194;">REPORTING</div><div style="font-size:12px;font-weight:650;margin-top:9px;">' + repText + '</div></div>' +
    '</div>' +
    '<div class="keep" style="font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:#6B7194;margin-top:24px;">DIMENSION BREAKDOWN <span style="font-weight:500;letter-spacing:0;color:#9AA0B8;">· weighted across reported regions</span></div>' +
    '<div style="margin-top:10px;">' + dimRows + '</div>' +
    '<div class="keep" style="font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:#6B7194;margin-top:24px;">REGIONAL DETAIL</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">' + regBlocks + '</div>' + pendBlock +
  '</div>';
}

function mainHTML(){
  const rows = computeRows();
  const reported = reportedRegions();
  const cards = sortRows(rows).map(cardHTML).join('');
  return headerHTML(D.MONTHS[state.month]) +
    '<div style="position:relative;z-index:1;max-width:1240px;margin:-60px auto 0;padding:0 40px 56px;">' +
      portfolioHTML(rows, reported) + filtersHTML(reported) +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;">' + cards + '</div>' +
    '</div>';
}

// Tracks whether the drawer is currently mounted, so its slide-in animation
// only plays on first open — a region switch while open refreshes the
// contents in place (no re-animation, no flash).
var phDrawerOpen = false;

function render(){
  document.getElementById('ph-main').innerHTML = mainHTML();
  const dEl = document.getElementById('ph-drawer');
  const dHtml = state.selected ? drawerHTML(!phDrawerOpen) : '';
  if (!dHtml){
    if (phDrawerOpen){ dEl.innerHTML = ''; phDrawerOpen = false; }
    return;
  }
  dEl.innerHTML = dHtml;
  phDrawerOpen = true;
}

function onAppClick(ev){
  let el = ev.target;
  while (el && el !== this && !el.getAttribute('data-act')) el = el.parentElement;
  if (!el || el === this) return;
  const act = el.getAttribute('data-act'), val = el.getAttribute('data-val');
  if (act === 'prev'){ if (state.month > 0){ state.month--; render(); } }
  else if (act === 'next'){ if (state.month < D.MONTHS.length - 1){ state.month++; render(); } }
  else if (act === 'region'){ state.region = val; render(); }
  else if (act === 'lens'){ state.region = (state.region === val ? 'ALL' : val); render(); }
  else if (act === 'sort'){ state.sort = val; render(); }
  else if (act === 'open'){ state.selected = val; render(); }
  else if (act === 'close'){ state.selected = null; render(); }
  else if (act === 'export'){ document.getElementById('ph-print').innerHTML = printReportHTML(val); window.print(); }
}
function onKeydown(ev){ if (ev.key === 'Escape' && state && state.selected){ state.selected = null; render(); } }

// Mount the dashboard once D is available (directly, or post-decryption).
function boot(){
  HEALTHY = (D.healthy != null ? D.healthy : 7);
  MONITOR = (D.monitor != null ? D.monitor : 5);
  state = { month: (D.defaultMonth != null ? D.defaultMonth : D.MONTHS.length - 1), region: 'ALL', sort: 'score', selected: null };
  const app = document.getElementById('app');
  app.innerHTML = '<div id="ph-main"></div><div id="ph-drawer"></div><div id="ph-print"></div>';
  app.addEventListener('click', onAppClick);
  document.addEventListener('keydown', onKeydown);
  render();
}

// AES-GCM decrypt of the embedded payload using a PBKDF2-derived key. Matches
// the Python encryptor: PBKDF2-SHA256 -> AES-256-GCM, ciphertext||tag.
async function decryptBlob(password, enc){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b(enc.salt), iterations: enc.iter, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(enc.iv) }, key, b(enc.ct));
  return new TextDecoder().decode(plain);
}

function showGate(){
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,#5465FF 0%,#93DFE3 50%,#B0F467 100%);padding:24px;">' +
      '<form id="ph-gate-form" style="width:100%;max-width:360px;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,80,0.25);padding:32px 30px;">' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:0.16em;color:#6B7194;">GLOBAL COMMERCE</div>' +
        '<div style="font-size:22px;font-weight:800;color:#000050;letter-spacing:-0.02em;margin-top:6px;">Partner Health Check</div>' +
        '<div style="font-size:13px;color:#6B7194;margin-top:8px;">Enter the password to view this confidential dashboard.</div>' +
        '<input id="ph-gate-pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin-top:18px;padding:11px 14px;border:1px solid #DDE1EE;border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;">' +
        '<div id="ph-gate-err" style="color:#EF4444;font-size:12px;font-weight:600;min-height:16px;margin-top:8px;"></div>' +
        '<button type="submit" style="width:100%;margin-top:6px;padding:11px;border:none;border-radius:10px;background:#000050;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Unlock</button>' +
      '</form>' +
    '</div>';
  const form = document.getElementById('ph-gate-form');
  const input = document.getElementById('ph-gate-pw');
  const err = document.getElementById('ph-gate-err');
  const btn = form.querySelector('button');
  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      D = JSON.parse(await decryptBlob(input.value, __ENC__));
      boot();
    } catch (e){
      btn.disabled = false; btn.textContent = 'Unlock';
      err.textContent = 'Incorrect password.';
      input.value = ''; input.focus();
    }
  });
  input.focus();
}

if (__ENC__){ showGate(); } else { boot(); }
